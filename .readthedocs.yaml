# https://docs.readthedocs.io/page/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Temporary release-candidate bootstrap. Remove once these versions are on
  # PyPI; pyproject.toml remains the authoritative runtime contract.
  jobs:
    pre_install:
      - python -m pip install "annplyr @ git+https://github.com/mdmanurung/annplyr@bb80d1285d41a1e0470311bb887018433c5acc80"
      - python -m pip install "plotnine-extra @ git+https://github.com/mdmanurung/plotnine-extra@184042606ead3522d624c478641bf024f8288812"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
