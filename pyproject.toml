[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ggann"
version = "0.1.0"
description = "A ggplot2-style plotting layer for scanpy AnnData objects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikhael Manurung", email = "mikhael.manurung@gmail.com" }]
keywords = ["single-cell", "anndata", "scanpy", "plotnine", "ggplot2", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "anndata>=0.12,<1",
    "scanpy>=1.11,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "plotnine>=0.15.3,<0.17",
    "plotnine-extra>=0.3.1,<0.4",
    "annplyr>=0.3,<0.4",
]

[project.optional-dependencies]
heatmap = ["PyComplexHeatmap>=1.7,<2"]
density = ["pynebulosa>=0.1.1,<1"]
upset = ["marsilea>=0.4,<1"]
pseudobulk = ["decoupler>=2,<3"]
test = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "PyComplexHeatmap>=1.7,<2",
    "pynebulosa>=0.1.1,<1",
    "marsilea>=0.4,<1",
    "decoupler>=2,<3",
]
docs = [
    "sphinx>=8.1,<9",
    "sphinx-book-theme>=1,<2",
    "sphinx-autodoc-typehints>=3,<4",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-design>=0.6,<1",
    "sphinxext-opengraph>=0.9,<1",
    "myst-nb>=1.1,<2",
    "ipython",
]
benchmark = ["psutil>=6,<8"]
release = ["build>=1.2,<2", "twine>=6,<7"]
dev = [
    "ggann[test,docs,benchmark,release]",
    "pyright[nodejs]>=1.1.400,<2",
    "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/mdmanurung/ggann"
Documentation = "https://mdmanurung.github.io/ggann/"
Source = "https://github.com/mdmanurung/ggann"
Issues = "https://github.com/mdmanurung/ggann/issues"
Changelog = "https://github.com/mdmanurung/ggann/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

[tool.pyright]
include = ["src/ggann"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
# pandas, plotnine, and the optional plotting backends expose deliberately
# dynamic APIs. Keep Pyright focused on errors it can prove in ggann itself.
reportArgumentType = false
reportAttributeAccessIssue = false
