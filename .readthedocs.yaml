# https://docs.readthedocs.io/page/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Temporary release-candidate bootstrap. Remove once these versions are on
  # PyPI; pyproject.toml remains the authoritative runtime contract.
  jobs:
    pre_install:
      - python -m pip install "annplyr @ git+https://github.com/mdmanurung/annplyr@b3ebb6ffdf754d314f4bb7d255ffb84a5888a4b6"
      - python -m pip install "plotnine-extra @ git+https://github.com/mdmanurung/plotnine-extra@337ae624809a0fdda21624a99a358e66a7e5a025"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
