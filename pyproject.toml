[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ggann"
version = "0.1.0"
description = "A ggplot2-style plotting layer for scanpy AnnData objects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikhael Manurung", email = "mikhael.manurung@gmail.com" }]
keywords = ["single-cell", "anndata", "scanpy", "plotnine", "ggplot2", "visualization"]

dependencies = [
    "anndata>=0.9",
    "scanpy>=1.9",
    "numpy>=1.23",
    "pandas>=2.0",
    "plotnine>=0.15.3,<0.17",
    "plotnine-extra @ git+https://github.com/mdmanurung/plotnine-extra@fcbd88f64760a2dd6e8200028a1a00909aa2c9f8",
    "annplyr @ git+https://github.com/mdmanurung/annplyr@c0f0735859a059c3570dfea2ac6f1df322ac582e",
]

[project.optional-dependencies]
heatmap = ["PyComplexHeatmap>=1.7"]
density = ["pynebulosa>=0.1.1"]
upset = ["marsilea>=0.4"]
pseudobulk = ["decoupler>=2.0"]
test = ["pytest>=7", "PyComplexHeatmap>=1.7", "pynebulosa>=0.1.1", "marsilea>=0.4", "decoupler>=2.0"]
dev = ["pytest>=7", "PyComplexHeatmap>=1.7", "pynebulosa>=0.1.1", "marsilea>=0.4", "decoupler>=2.0", "ruff"]
docs = [
    "sphinx>=8.1",
    "sphinx-book-theme>=1",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxext-opengraph",
    "myst-nb>=1.1",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/mdmanurung/ggann"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
