name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Temporary release-candidate bootstrap. Remove once both dependencies
      # are available at the versions declared in pyproject.toml.
      - uses: actions/checkout@v4
        with:
          repository: mdmanurung/annplyr
          ref: cadb0e77eeb4ce9eef6a47deb9a51b93e6abf617
          path: vendor/annplyr
      - uses: actions/checkout@v4
        with:
          repository: mdmanurung/plotnine-extra
          ref: fcbd88f64760a2dd6e8200028a1a00909aa2c9f8
          path: vendor/plotnine-extra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ggann with docs extras
        run: |
          python -m pip install --upgrade pip
          pip install ./vendor/annplyr ./vendor/plotnine-extra
          pip install -e ".[docs]"
      # The executable vignettes run with GGANN_DOCS_OFFLINE=1, which turns a
      # missing dataset into an error instead of a download. Fetch it here.
      - name: Cache the PBMC3K dataset
        uses: actions/cache@v4
        with:
          path: data
          key: scanpy-datasets-pbmc3k-processed-v1
      - name: Fetch documentation datasets
        run: python scripts/fetch_datasets.py
      - name: Build docs
        env:
          GGANN_DOCS_OFFLINE: "1"
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
